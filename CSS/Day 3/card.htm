<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
        }
        .card{
            height: 300px;
            width: 250px;
            margin: 30px auto;
            border-radius: 20px;
            background-color: white;
            
        }
        #up{
            height: 50%;
            background-color: rgb(83, 125, 249);
            position: relative;
            border-radius: 20px 20px 0px 20px;
        }
        #bottom{
            height: 50%;
            background-color: rgb(255, 255, 255);
            border-radius: 0px 20px 20px 20px;
        }
        #cir{

            height: 90px;
            width: 90px;
            background-color: white;
            border-radius: 100%;
            position: absolute;
            left: 75px;
            top: 27px;
            
        }
        img{
            height: 88%;
            width: 88%;
            border-radius: 100%;
            position: absolute;
            top: 2px;
            left: 2px;
            border: 3.5px solid rgb(45, 45, 217);

        }
        h3{
            margin: 0px;
            position: absolute;
            left: 120px;
            top: 200px;

        }
        #text{
            /* background-color: aqua; */
            width: 70%;
            text-align: center;
            font-size: small;
            position: relative;
            top: 50px;
            left: 30px;
        }
        button{
            padding: 6px 20px;

            background-color: rgb(83, 125, 249);
            color: white;
            border: none;
            border-radius: 5px;
            position: relative;
            top: 65px;
            left: 70px;
        }
    </style>
</head>
<body>
    <div class="card">

        <div id="up">
            <div id="cir">
                <img src="Screenshot 2026-09-09 at 10.12.01 AM.png" alt="">
            </div>
        </div>
        <div id="bottom">
            <h3>Davidm Dell</h3>
            <div id="text">Lorem ipsum dolor sit amet consectetur dsfdsg fdgdf sdfg fdgs  elit. Enim tenetur</div>
            <button>view more</button>
        </div>

        
    </div>
</body>
</html>
