<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #m{
            height: 300px;
            width: 300px;
            border: 2px solid red;
            margin: 10px auto;

            position: relative;

        #c{
            background-color: rgb(72, 225, 93);

            position: absolute;
            top: 50px;

        }

    <div id="m">
        <div id="c"></div>
    </div>
</body>
</html>
